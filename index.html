<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusKart - College Sale</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-indigo-50 text-slate-900">

  <nav class="flex items-center justify-between bg-indigo-950 px-6 py-3 text-white">
    <h1 class="text-sm font-bold text-amber-400">CampusKart</h1>
    <div class="flex items-center gap-5 text-xs">
      <a href="#products" class="hover:text-amber-400">Shop</a>
      <a href="#cart" class="hover:text-amber-400">Cart (<span id="cart-count">0</span>)</a>
    </div>
  </nav>

  <section class="flex flex-col items-center justify-between gap-6 bg-gradient-to-r from-violet-600 to-indigo-600 px-8 py-10 text-center text-white md:flex-row md:text-left">
    <div>
      <h2 class="text-3xl font-extrabold">College Sale</h2>
      <p class="mt-2 text-sm text-indigo-100">Up to 50% off on bags, books and more</p>
      <a href="#products" class="mt-5 inline-block rounded bg-amber-400 px-5 py-2 text-sm font-bold text-indigo-950 transition hover:bg-amber-300">Shop Now</a>
    </div>
    <div class="flex h-40 w-40 shrink-0 items-center justify-center rounded-lg bg-amber-400 text-2xl font-bold text-indigo-950 shadow-lg">
      50% OFF
    </div>
  </section>

  <section class="grid grid-cols-3 gap-3 px-5 py-6 text-center">
    <div class="rounded-lg bg-white p-4 shadow-sm">
      <p class="text-lg font-bold text-indigo-600">Free</p>
      <p class="text-xs text-slate-500">Delivery</p>
    </div>
    <div class="rounded-lg bg-white p-4 shadow-sm">
      <p class="text-lg font-bold text-indigo-600">7-Day</p>
      <p class="text-xs text-slate-500">Return</p>
    </div>
    <div class="rounded-lg bg-white p-4 shadow-sm">
      <p class="text-lg font-bold text-indigo-600">COD</p>
      <p class="text-xs text-slate-500">Available</p>
    </div>
  </section>

  <section id="products" class="grid grid-cols-1 gap-4 px-5 pb-8 sm:grid-cols-2 lg:grid-cols-4">
    <div class="product-card">
      <img src="images/backpack.jpg" alt="Backpack" class="product-image">
      <h3 class="product-title">Backpack</h3>
      <p class="product-price">Rs. 799 <span class="old-price">1299</span></p>
      <button class="add-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="images/notebooks.jpg" alt="Notebooks" class="product-image">
      <h3 class="product-title">Notebook Set</h3>
      <p class="product-price">Rs. 199 <span class="old-price">299</span></p>
      <button class="add-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="images/bottle.jpg" alt="Water Bottle" class="product-image">
      <h3 class="product-title">Water Bottle</h3>
      <p class="product-price">Rs. 349 <span class="old-price">499</span></p>
      <button class="add-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="images/earphones.jpg" alt="Earphones" class="product-image">
      <h3 class="product-title">Earphones</h3>
      <p class="product-price">Rs. 599 <span class="old-price">999</span></p>
      <button class="add-cart">Add to Cart</button>
    </div>
  </section>

  <footer class="bg-indigo-950 px-4 py-6 text-center text-indigo-200">
    <p class="text-xs">&copy; 2026 CampusKart</p>
    <div class="mt-3 flex justify-center gap-6 text-xs">
      <a href="#" class="hover:text-amber-400">About</a>
      <a href="#" class="hover:text-amber-400">Contact</a>
    </div>
  </footer>

  <script>
    let cartCount = 0;
    const cartCountElement = document.getElementById("cart-count");

    document.querySelectorAll(".add-cart").forEach((button) => {
      button.addEventListener("click", () => {
        cartCount++;
        cartCountElement.textContent = cartCount;

        const originalText = button.textContent;
        button.textContent = "Added!";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1000);
      });
    });
  </script>
</body>
</html>
